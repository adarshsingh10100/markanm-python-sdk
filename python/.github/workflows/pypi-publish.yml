name: Publish MarkanM Python SDK to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for PyPI OIDC Trusted Publishing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build & Publishing Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Source Distribution & Wheel
        run: |
          python -m build

      - name: Publish Package to PyPI (OIDC Trusted Publishing or Token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
